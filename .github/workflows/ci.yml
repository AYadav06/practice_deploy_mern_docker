name: CI
on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main
jobs:
    build:
        runs-on: ubuntu-latest
        env:
            DATABASE_URL: ${{ secrets.DATABASE_URL}}

        steps:
            - name: checkout code 
              uses: actions/checkout@v4

            - name : install node
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: npm 
            
            - run: npm ci
            - run: npm run build