name: CD
on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: check out code 
              uses: actions/checkout@v4

            - name: Docker login
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push 
              uses: docker/build-push-action@v6
              with:
                context: .
                file:  ./Dockerfile
                push: true
                tags: ${{ secrets.DOCKERHUB_USERNAME }}/prisma-deploy:${{ github.sha }}
                build-args: |
                  DATABASE_URL=${{ secrets.DATABASE_URL }}

            - name: Deploy to VM
              uses: appleboy/ssh-action@v1
              with:
                host: ${{ secrets.HOST }}
                username: ${{ secrets.USER }}
                key: ${{ secrets.VM_SSH_KEY }}
                script: |
                 docker pull ${{ secrets.DOCKERHUB_USERNAME }}/prisma-deploy:${{ github.sha }}
                 export PATH="$HOME/.nvm/versions/node/v24.13.0/bin:$PATH"
                 docker stop prisma_deploy  || true
                 docker rm prisma_deploy  || true
                 docker run --name prisma_deploy -d -p 8080:8080 -e DATABASE_URL=${{ secrets.DATABASE_URL }} ${{ secrets.DOCKERHUB_USERNAME }}/prisma-deploy:${{ github.sha }}
                 docker image prune -f 