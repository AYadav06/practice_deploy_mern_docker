name: CD
on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: check out code 
              uses: actions/checkout@v4

            - name: Docker login
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push 
              uses: docker/build-push-action@v4
              with:
                context: .
                file:  ./Dockerfile
                push: true
                tags: ${{ secrets.DOCKERHUB_USERNAME }}/prisma-deploy:${{ github.sha }}

            - name: Deploy to VM
              uses: appleboy/ssh-action@v1
              with:
                host: ${{ secrets.HOST }}
                username: ${{ secrets.USER }}
                key: ${{ secrets.VM_SSH_KEY }}
                script: |
                 export PATH="$HOME/.nvm/versions/node/v24.13.0/bin:$PATH"
                 docker stop prisma_deploy  
                 docker run --name prisma_deploy -d -p 8080:8080 amityadav0612/test_deploy:${{ secrets.github.sha }}